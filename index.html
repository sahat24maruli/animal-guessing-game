<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Kids Learning World</title>

  <link rel="stylesheet" href="css/home.css">
</head>

<body>

  <main class="home-screen">

    <div class="home-stage">

      <!-- THE ACTUAL DESIGN -->
      <img
        src="assets/ui/home-screen.png"
        class="home-image"
        alt="Kids Learning World"
      >

      <!-- =========================
           INVISIBLE CLICK AREAS
      ========================== -->

      <!-- Sound -->
      <button
        id="soundButton"
        class="hotspot sound-hotspot"
        aria-label="Sound"
      ></button>

      <!-- Exit -->
      <button
        id="exitButton"
        class="hotspot exit-hotspot"
        aria-label="Exit"
      ></button>

      <!-- Animal Adventure -->
      <button
        id="animalAdventureButton"
        class="hotspot animal-hotspot"
        aria-label="Animal Adventure"
      ></button>

    </div>

  </main>

  <script src="js/home.js"></script>

</body>

</html>

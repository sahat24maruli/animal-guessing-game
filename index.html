
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <meta
    name="description"
    content="Kids Learning World - Fun educational games for children"
  >

  <title>Kids Learning World</title>

  <link rel="stylesheet" href="css/home.css">

</head>


<body>

  <main class="home-screen">

    <!-- =====================================
         SKY
    ====================================== -->

    <div class="sky">

      <div class="sun"></div>

      <div class="cloud cloud-one"></div>
      <div class="cloud cloud-two"></div>
      <div class="cloud cloud-three"></div>

    </div>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="game-header">

      <div class="logo">

        <span class="logo-kids">
          KIDS
        </span>

        <span class="logo-learning">
          LEARNING
        </span>

        <span class="logo-world">
          WORLD
        </span>

      </div>

      <div class="logo-subtitle">
        Learn • Play • Explore
      </div>

    </header>


    <!-- =====================================
         TOP CONTROLS
    ====================================== -->

    <div class="top-controls">

      <button
        id="soundButton"
        class="control-button"
        type="button"
        aria-label="Toggle sound"
        aria-pressed="false"
      >
        <span id="soundIcon">🔊</span>
      </button>


      <button
        id="exitButton"
        class="control-button"
        type="button"
        aria-label="Exit"
      >
        <span>🚪</span>
      </button>

    </div>


    <!-- =====================================
         MAIN WORLD
    ====================================== -->

    <section class="world">

      <!-- BACKGROUND HILLS -->

      <div class="hill hill-back"></div>
      <div class="hill hill-middle"></div>
      <div class="hill hill-front"></div>


      <!-- ===================================
           TREES
      ==================================== -->

      <div class="tree tree-left">

        <div class="tree-crown">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="tree-trunk"></div>

      </div>


      <div class="tree tree-right">

        <div class="tree-crown">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="tree-trunk"></div>

      </div>


      <!-- ===================================
           CHARACTERS
      ==================================== -->

      <div class="world-animal animal-lion">

        <img
          src="assets/ui/animals/lion.png"
          alt="Friendly lion"
        >

      </div>


      <div class="world-animal animal-elephant">

        <img
          src="assets/ui/animals/elephant.png"
          class="elephant-image"
          alt="Friendly elephant"
        >

      </div>


     <!-- =========================================
     MAIN MENU
========================================= -->

<div class="main-menu">

  <div class="welcome-text">
    LET'S EXPLORE!
  </div>

  <div class="game-grid">

    <!-- =========================
         ANIMAL ADVENTURE
    ========================== -->

    <button
      id="animalAdventureButton"
      class="game-card game-card-animal"
      type="button"
      aria-label="Animal Adventure"
    >
    

      <div class="game-card-icon">
        🦁
      </div>

      <div class="game-card-content">

        <div class="game-card-title">
          ANIMAL
        </div>

        <div class="game-card-subtitle">
          ADVENTURE
        </div>

      </div>

      <div class="game-card-arrow">
        ▶
      </div>

    </button>


    <!-- =========================
         ABC ADVENTURE
    ========================== -->

    <button
  class="game-card abc-card"
  type="button"
  disabled
>
  <div class="game-lock">🔒</div>

  <div class="card-icon">
    🔤
  </div>

  <div class="card-text">
    <span class="card-title">ABC</span>
    <span class="card-subtitle">ADVENTURE</span>
  </div>
</button>


    <!-- =========================
         NUMBER ADVENTURE
    ========================== -->

    <button
  class="game-card number-card"
  type="button"
  disabled
>
  <div class="game-lock">🔒</div>

  <div class="card-icon">
    🔢
  </div>

  <div class="card-text">
    <span class="card-title">NUMBER</span>
    <span class="card-subtitle">ADVENTURE</span>
  </div>
</button>


    <!-- =========================
         COLOR ADVENTURE
    ========================== -->

    <button
  class="game-card color-card"
  type="button"
  disabled
>
  <div class="game-lock">🔒</div>

  <div class="card-icon">
    🎨
  </div>

  <div class="card-text">
    <span class="card-title">COLOR</span>
    <span class="card-subtitle">ADVENTURE</span>
  </div>
</button>

</div>


      <!-- ===================================
           FLOWERS
      ==================================== -->

      <div class="flower flower-one">🌼</div>
      <div class="flower flower-two">🌸</div>
      <div class="flower flower-three">🌻</div>
      <div class="flower flower-four">🌸</div>
      <div class="flower flower-five">🌼</div>


      <!-- ===================================
           GRASS
      ==================================== -->

      <div class="grass grass-one"></div>
      <div class="grass grass-two"></div>
      <div class="grass grass-three"></div>
      <div class="grass grass-four"></div>


      <!-- ===================================
           GROUND
      ==================================== -->

      <div class="ground"></div>

    </section>


    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="game-footer">

      🌎 A fun world for curious kids

    </footer>

  </main>


  <!-- =====================================
       BACKGROUND MUSIC
  ====================================== -->

  <audio
    id="backgroundMusic"
    src="assets/audio/background-music.mp3"
    loop
    preload="auto"
  ></audio>


  <script src="js/home.js"></script>

</body>

</html>
